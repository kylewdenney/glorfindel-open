[workspace]
members = [
    "crates/glorfindel-schemas",
    "crates/glorfindel-transport",
    "crates/glorfindel-tools",
    "crates/glorfindel-agent",
    "crates/glorfindel-orchestrator",
    "crates/glorfindel-admin",
]
resolver = "2"

[package]
name = "glorfindel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An agentic AI framework using OMS-derived pub/sub architecture with DDS control plane and ZeroMQ data plane"

[[bin]]
name = "glorfindel"
path = "src/main.rs"

[[example]]
name = "simple_task"
path = "examples/simple_task.rs"

[[example]]
name = "register_agent"
path = "examples/register_agent.rs"

[[example]]
name = "dm_assistant"
path = "examples/dm_assistant.rs"

[[bin]]
name = "glorfindel-admin"
path = "src/admin.rs"


[dependencies]
glorfindel-schemas = { path = "crates/glorfindel-schemas" }
glorfindel-transport = { path = "crates/glorfindel-transport" }
glorfindel-tools = { path = "crates/glorfindel-tools" }
glorfindel-agent = { path = "crates/glorfindel-agent" }
glorfindel-orchestrator = { path = "crates/glorfindel-orchestrator" }
glorfindel-admin = { path = "crates/glorfindel-admin" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
