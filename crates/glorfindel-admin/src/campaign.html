    // ─ File operations ──────────────────────────────────────────
    async openFile(filePath) {
      if (this.isDirty && !confirm('Discard unsaved changes?')) return;
      this.activeFilePath = filePath;
      this.fileContent = null;
      this.editContent = '';
      this.isDirty = false;
      this.lastSaved = false;
      this.loadingFile = true;
      this.editMode = false;
      try {
        const encoded = filePath.split('/').map(encodeURIComponent).join('/');
        const data = await (await fetch(`/api/campaign/${enc(this.activeCampaign)}/file/${encoded}`)).json();
        this.fileContent = data.contents;
        this.editContent = data.contents;
        this._parseSceneCharacters(data.contents, filePath);
      } catch {
        this.fileContent = '_Error loading file._';
      } finally {
        this.loadingFile = false;
      }
    },
    setViewMode(isEdit) {
      if (isEdit) {
        this.editContent = this.fileContent || '';
        this.isDirty = false;
      }
      this.editMode = isEdit;
    },
    async saveFile() {
      if (!this.activeFilePath || this.saving) return;
      this.saving = true;
      try {
        const encoded = this.activeFilePath.split('/').map(encodeURIComponent).join('/');
        const r = await fetch(`/api/campaign/${enc(this.activeCampaign)}/file/${encoded}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: this.editContent }),
        });
        if (!r.ok) { alert('Save failed: ' + await r.text()); return; }
        this.fileContent = this.editContent;
        this.isDirty = false;
        this.lastSaved = true;
        await this.refreshFiles();
      } catch (e) {
        alert('Error: ' + e.message);
      } finally {
        this.saving = false;
      }
    },
    async createFile() {
      const path = this.newFilePath.trim();
      if (!path) return;
      const encoded = path.split('/').map(encodeURIComponent).join('/');
      const r = await fetch(`/api/campaign/${enc(this.activeCampaign)}/file/${encoded}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: '' }),
      });
      if (!r.ok) { alert('Failed: ' + await r.text()); return; }
      this.showNewFile = false;
      this.newFilePath = '';
      await this.refreshFiles();
      await this.openFile(path);
      this.editMode = true;
    },
    toggleDir(subdir) {
      const s = new Set(this.collapsedDirs);
      s.has(subdir) ? s.delete(subdir) : s.add(subdir);
      this.collapsedDirs = s;
    },
    openSessionNotes() {
      const f = this.files.find(f => f.filename === 'session_notes.md');
      if (f) this.openFile(f.path);
    },

    // ─ Agents ───────────────────────────────────────────────────
    async loadDefinitions() {
      try { this.definitions = await (await fetch('/api/definitions')).json(); } catch {}
      this._preselectDmDef();
    },
    _preselectDmDef() {
      if (!this.activeCampaign) return;
      const dmDef = this.campaignDefs.find(d => d.name.toLowerCase().includes('dm'));
      if (dmDef) this.spawnDefId = dmDef.id;
    },
    async loadAgents() {
      try {
        const agents = await (await fetch('/api/agents')).json();
        this.runningAgents = agents;
        if (this.selectedAgentId && !agents.find(a => a.instance_id === this.selectedAgentId)) {
          this.selectedAgentId = agents.length > 0 ? agents[0].instance_id : null;
        }
      } catch {}
    },
    selectAgent(agent) { this.selectedAgentId = agent.instance_id; },
    async spawnAgent() {
      if (!this.spawnDefId || this.spawning) return;
      this.spawning = true;
      try {
        const r = await fetch('/api/agents', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ definition_id: this.spawnDefId, deployment: 'test' }),
        });
        if (!r.ok) { alert('Spawn failed: ' + await r.text()); return; }
        const agent = await r.json();
        await this.loadAgents();
        this.selectedAgentId = agent.instance_id;
        this.showSpawnPanel = false;
        this.spawnDefId = '';
      } catch (e) { alert('Error: ' + e.message); }
      finally { this.spawning = false; }
    },
    async stopAgent(instanceId) {
      if (!confirm('Stop this agent?')) return;
      await fetch(`/api/agents/${instanceId}`, { method: 'DELETE' });
      await this.loadAgents();
    },
    agentModelLabel(agent) {
      const mb = agent.capability?.model_backend;
      if (mb?.ollama) return mb.ollama.model;
      if (mb?.anthropic) return mb.anthropic.model;
      return '?';
    },
    agentCampaignName(agent) {
      const def = this.definitions.find(d => d.id === agent.definition_id);
      if (!def?.campaign_dir) return null;
      const parts = def.campaign_dir.replace(/\\/g, '/').split('/');
      return parts[parts.length - 1] || null;
    },

    // ─ Run DM ───────────────────────────────────────────────────
    buildPerms() {
      const perms = [{ custom: 'campaign.read' }, { custom: 'campaign.list' }];
      if (this.grantWrite)    perms.push({ custom: 'campaign.write' });
      if (this.grantRulebook) perms.push({ custom: 'rulebook.search' });
      return perms;
    },

    async runDM() {
      if (!this.canRun) return;
      const defId = this.selectedDefinitionId();
      if (!defId) return this.runTask();

      const perms = this.buildPerms();
      const savedIntent = this.intent.trim();

      if (this.useSessionApi) {
        const sdir = this.sessionDir.trim() || this.activeSession || 'session1';
        const body = {
          definition_id: defId,
          session_dir: sdir,
          intent: savedIntent,
          permissions: [...perms, { custom: 'rulebook.search' }],
          max_iterations: this.maxIterations,
        };
        if (this.outputFile.trim()) body.output_file = this.outputFile.trim();
        this.thinkingPhase = '🧠 Thinker…';
        try {
          const r = await fetch(`/api/campaign/${enc(this.activeCampaign)}/session`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!r.ok) { alert('Session turn failed: ' + await r.text()); return; }
          const { task_id } = await r.json();
          this.runningTask = task_id;
          this.intent = '';
          this.outputFile = '';
          this.watchTask(task_id, savedIntent);
        } catch (e) { alert('Error: ' + e.message); }
        return;
      }

      const endpoint = this.deepThink ? 'think' : 'run';
      if (this.deepThink) this.thinkingPhase = '🧠 Thinker…';
      try {
        const r = await fetch(`/api/campaign/${enc(this.activeCampaign)}/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            definition_id: defId,
            intent: savedIntent,
            permissions: perms,
            max_iterations: this.maxIterations,
          }),
        });
        if (!r.ok) { alert('Failed: ' + await r.text()); return; }
        const { task_id } = await r.json();
        this.runningTask = task_id;
        this.intent = '';
        this.watchTask(task_id, savedIntent);
      } catch (e) { alert('Error: ' + e.message); }
    },

    // ─ Play Mode ────────────────────────────────────────────────
    async takeAction() {
      if (!this.canPlay) return;
      const sdir = this.sessionDir.trim() || this.activeSession || 'session1';
      const body = {
        session_dir: sdir,
        character: this.activeCharacter.trim(),
        action: this.playerAction.trim(),
      };
      const defId = this.selectedDefinitionId();
      if (defId) body.definition_id = defId;

      this.thinkingPhase = '🔍 What Happened…';
      const savedAction = this.playerAction.trim();
      try {
        const url = this.activeScene
          ? `/api/campaign/${enc(this.activeCampaign)}/session/${enc(sdir)}/scene/${enc(this.activeScene)}/player-turn`
          : `/api/campaign/${enc(this.activeCampaign)}/player-turn`;
        const r = await fetch(url, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) { alert('Player turn failed: ' + await r.text()); return; }
        const { task_id } = await r.json();
        this.runningTask = task_id;
        this.playerAction = '';
        this.watchTask(task_id, savedAction);
      } catch (e) { alert('Error: ' + e.message); }
      finally { this.thinkingPhase = null; }
    },

    async loadParty() {
      if (!this.activeCampaign) return;
      this.partyLoading = true;
      try {
        const r = await fetch(`/api/campaign/${enc(this.activeCampaign)}/file/world/party.md`);
        if (!r.ok) return;
        const data = await r.json();
        const text = typeof data === 'string' ? data : (data.contents || '');
        if (text) this._parseParty(text);
      } catch(e) { console.error('loadParty:', e); }
      finally { this.partyLoading = false; }
    },

    _parseParty(text) {
      const cards = [];
      const members = [];
      const devotions = {};
      // Split on ## headings — each is a character
      const sections = text.split(/^## /m).slice(1);
      for (const sec of sections) {
        const nl = sec.indexOf('\n');
        const name = nl >= 0 ? sec.slice(0, nl).trim() : sec.trim();
        // Strip italic annotation like *Descendant of…*
        const cleanName = name.replace(/\s*\n[\s\S]*/, '').replace(/\*[^*]*\*/g, '').trim();
        if (!cleanName) continue;
        members.push(cleanName);
        // Find Devotion line
        const devotionMatch = sec.match(/Devotion:\s*([A-Z\s]+)/);
        const devotion = devotionMatch ? devotionMatch[1].trim() : null;
        if (devotion) devotions[cleanName] = devotion;
        // Find stat line: **BLADE +4 | PRESENCE +2 | …** (one bold block, pipe-separated)
        const knownStats = ['BLADE','PRESENCE','LORE','RITUAL','OFFERING','VEIL'];
        const stats = [...sec.matchAll(/\b([A-Z]{2,})\s+([+-]?\d+)/g)]
          .map(m => ({ label: m[1], val: m[2] }))
          .filter(s => knownStats.includes(s.label));
        cards.push({ name: cleanName, devotion, stats });
      }
      this.partyCards = cards;
      this.partyMembers = members;
      this.partyDevotions = devotions;
      // Auto-select first character if none chosen
      if (!this.activeCharacter && members.length > 0) this.activeCharacter = members[0];
    },

    async loadLastScene() {
      if (!this.activeCampaign || !this.activeSession) return;
      const sessionFiles = this.files.filter(f =>
        f.subdir === this.activeSession && f.filename.endsWith('.md') &&
        f.filename !== 'TURNS.md' && !f.filename.startsWith('.')
      );
      if (sessionFiles.length === 0) return;
      const last = sessionFiles[sessionFiles.length - 1];
      await this.openFile(last.path);
    },

    // Scans opened file content for a "Characters:" line and updates the scene filter.
    // Only fires when the line is present — opening a regular turn file leaves the filter intact.
    _parseSceneCharacters(text, filePath) {
      if (!text) return;
      const m = text.match(/\*{0,2}Characters:\*{0,2}\s*([^\n]+)/i);
      if (!m) return;
      const names = m[1].split(',')
        .map(n => n.replace(/\*/g, '').trim())
        .filter(Boolean);
      if (names.length > 0) {
        this.sceneCharacters = names;
        this.sceneFile = filePath || null;
      }
    },

    async runTask() {
      const perms = this.buildPerms();
      try {
        const r = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            agent_instance_id: this.selectedAgentId,
            intent: this.intent.trim(),
            permissions: perms,
            max_iterations: this.maxIterations,
          }),
        });
        if (!r.ok) { alert('Failed: ' + await r.text()); return; }
        const { task_id } = await r.json();
        this.runningTask = task_id;
        const savedIntent = this.intent;
        this.intent = '';
        this.watchTask(task_id, savedIntent);
      } catch (e) { alert('Error: ' + e.message); }
    },

    watchTask(taskId, _intent) {
      // Update thinkingPhase from bus messages
      const phaseFromBus = setInterval(() => {
        const last = this.busMessages[this.busMessages.length - 1];
        if (last?.step) {
          this.thinkingPhase = last.step + '…';
        }
      }, 500);

      const ws = new WebSocket(`ws://${location.host}/ws/tasks/${taskId}`);
      ws.onmessage = async (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'complete' || msg.type === 'failed') {
          this.runningTask = null;
          this.thinkingPhase = null;
          clearInterval(phaseFromBus);
          ws.close();
          await Promise.all([this.refreshFiles(), this.loadAgents()]);
          if (this.activeFilePath) await this.openFile(this.activeFilePath);
          // Refresh session file list
          if (this.activeCampaign) await this.refreshFiles();
        }
      };
      ws.onerror = () => { this.runningTask = null; clearInterval(phaseFromBus); };

      const poll = setInterval(async () => {
        try {
          const t = await (await fetch(`/api/tasks/${taskId}`)).json();
          if (t.status === 'complete' || t.status === 'failed') {
            clearInterval(poll);
            clearInterval(phaseFromBus);
            this.runningTask = null;
            this.thinkingPhase = null;
            await Promise.all([this.refreshFiles(), this.loadAgents()]);
            if (this.activeFilePath) await this.openFile(this.activeFilePath);
          }
        } catch {}
      }, 3000);
    },

    // Run a quick query against a campaign definition via the /run endpoint.
    // Derives permissions from def.default_permissions so both file.read and campaign.read
    // agents work correctly without hardcoding permission strings.
    async _quickCampaignRun(def, intent) {
      const perms = (def.default_permissions || []).length > 0
        ? def.default_permissions
        : ['file_read'];
      const r = await fetch(`/api/campaign/${enc(this.activeCampaign)}/run`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ definition_id: def.id, intent, permissions: perms, max_iterations: 6 }),
      });
      if (!r.ok) throw new Error(await r.text());
      const { task_id } = await r.json();
      return new Promise((resolve, reject) => {
        const ws = new WebSocket(`ws://${location.host}/ws/tasks/${task_id}`);
        ws.onmessage = ev => {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'complete') { ws.close(); resolve(msg.response); }
          else if (msg.type === 'failed') { ws.close(); reject(new Error(msg.message)); }
        };
        ws.onerror = () => {};
        const poll = setInterval(async () => {
          try {
            const t = await (await fetch(`/api/tasks/${task_id}`)).json();
            if (t.status === 'complete') { clearInterval(poll); resolve(t.response); }
            else if (t.status === 'failed') { clearInterval(poll); reject(new Error(t.error || 'failed')); }
          } catch {}
        }, 2000);
      });
    },

    async askArchivist() {
      if (!this.archivistQuery.trim() || this.archivistBusy || !this.activeCampaign) return;
      this.archivistBusy = true; this.archivistAnswer = null;
      try {
        const def = this.archivistDef;
        if (!def) { this.archivistAnswer = 'No lore agent configured for this campaign.'; return; }
        // If using the DM as archivist, prepend context so it reads campaign files
        const isDedicated = def.name.toLowerCase().includes('archivist');
        const intent = isDedicated
          ? this.archivistQuery
          : `Read campaign files and answer this question about the ${this.activeCampaign} campaign: ${this.archivistQuery}`;
        const resp = await this._quickCampaignRun(def, intent);
        const r = resp?.result;
        this.archivistAnswer = typeof r === 'string' ? r : (r?.action_summary || JSON.stringify(r) || '(no answer)');
      } catch (e) { this.archivistAnswer = 'Error: ' + e.message; }
      finally { this.archivistBusy = false; }
    },

    async askRules() {
      if (!this.rulesQuery.trim() || this.rulesBusy || !this.activeCampaign) return;
      this.rulesBusy = true; this.rulesAnswer = null;
      try {
        const def = this.rulesDef;
        if (!def) { this.rulesAnswer = 'No rules agent configured for this campaign.'; return; }
        // If using the DM, point it at the rules/ directory explicitly
        const isDedicated = def.name.toLowerCase().includes('rule');
        const intent = isDedicated
          ? this.rulesQuery
          : `Read the rules/ directory in the ${this.activeCampaign} campaign files and answer: ${this.rulesQuery}`;
        const resp = await this._quickCampaignRun(def, intent);
        const r = resp?.result;
        this.rulesAnswer = typeof r === 'string' ? r : (r?.action_summary || JSON.stringify(r) || '(no answer)');
      } catch (e) { this.rulesAnswer = 'Error: ' + e.message; }
      finally { this.rulesBusy = false; }
    },

    // ─ Helpers ──────────────────────────────────────────────────
    isLogFile() {
      return this.activeFilePath && this.activeFilePath.includes('.meta/') && this.activeFilePath.endsWith('.log');
    },
    parseLogChat(text) {
      if (!text) return [];
      const msgs = [];
      const sectionRe = /^## (.+)$/m;
      // Header block (everything before first ##)
      const firstSection = text.search(sectionRe);
      const headerText = firstSection > 0 ? text.slice(0, firstSection).trim() : '';
      if (headerText) {
        msgs.push({ emoji: '📜', label: 'Log Header', cls: 'log-chat-header', color: 'color:#6a5a3a;', body: headerText, time: '' });
      }
      // Split on ## sections
      const parts = text.split(/^## /m).slice(1);
      for (const part of parts) {
        const nl = part.indexOf('\n');
        const rawLabel = nl >= 0 ? part.slice(0, nl).trim() : part.trim();
        const body = nl >= 0 ? part.slice(nl + 1).trim() : '';
        const label = rawLabel.replace(/^[\p{Emoji}\s]+/u, '').trim();
        const emoji = (rawLabel.match(/^[\p{Emoji}]+/u) || ['💬'])[0];
        const lo = rawLabel.toLowerCase();
        let cls = 'log-chat-header', color = 'color:#7a6a50;';
        if (lo.includes('session writer') || lo.includes('🧠')) { cls = 'log-chat-dm';      color = 'color:#f0c060;'; }
        else if (lo.includes('thinker'))   { cls = 'log-chat-thinker';  color = 'color:#d4a840;'; }
        else if (lo.includes('critic'))    { cls = 'log-chat-critic';   color = 'color:#d08040;'; }
        else if (lo.includes('rule'))      { cls = 'log-chat-rules';    color = 'color:#40c090;'; }
        else if (lo.includes('turn files') || lo.includes('files read') || lo.includes('campaign')) { cls = 'log-chat-campaign'; color = 'color:#6090d0;'; }
        else if (lo.includes('dice'))      { cls = 'log-chat-dice';     color = 'color:#9060d0;'; }
        else if (lo.includes('summary') || lo.includes('action')) { cls = 'log-chat-summary'; color = 'color:#60b070;'; }
        else if (lo.includes('dm') || lo.includes('prose') || lo.includes('writer')) { cls = 'log-chat-dm'; color = 'color:#f0c060;'; }
        else if (lo.includes('✍') || lo.match(/turn\d/)) { cls = 'log-chat-summary'; color = 'color:#80d080;'; }
        else if (lo.includes('files') || lo.includes('file')) { cls = 'log-chat-files'; color = 'color:#80c060;'; }
        msgs.push({ emoji, label: label || rawLabel, cls, color, body, time: '' });
      }
      return msgs;
    },
    renderMarkdown(text) {
      if (!text) return '';
      try { return marked.parse(text); } catch { return text; }
    },
    fileBadge(filename) {
      const f = filename.toLowerCase();
      if (f.startsWith('turn'))   return 'turn';
      if (f.endsWith('.log'))     return 'meta';
      if (f === 'turns.md')       return 'idx';
      if (f.includes('npc'))      return 'npc';
      if (f.includes('party'))    return 'party';
      if (f.includes('notes'))    return 'notes';
      if (f.includes('hook'))     return 'hook';
      if (f.startsWith('rule'))   return 'rule';
      if (f.includes('world') || f.includes('setting')) return 'world';
      return 'file';
    },
    fileBadgeClass(filename) {
      const f = filename.toLowerCase();
      if (f.startsWith('turn'))   return 'badge badge-turn';
      if (f.endsWith('.log'))     return 'badge badge-meta';
      if (f === 'turns.md')       return 'badge badge-rule';
      if (f.includes('npc'))      return 'badge badge-npc';
      if (f.includes('party'))    return 'badge badge-party';
      if (f.includes('notes'))    return 'badge badge-note';
      if (f.includes('hook'))     return 'badge badge-hook';
      if (f.startsWith('rule'))   return 'badge badge-rule';
      if (f.includes('world') || f.includes('setting')) return 'badge badge-world';
      return 'badge badge-file';
    },
  };
}

function enc(s) { return encodeURIComponent(s); }
</script>
