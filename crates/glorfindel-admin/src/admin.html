<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glorfindel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .spinner {
      border: 2px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    pre { white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" x-data="admin()" x-init="init()" x-cloak>

  <!-- Header -->
  <div class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center gap-3">
    <span class="text-indigo-400 font-bold text-lg tracking-tight">Glorfindel</span>
    <span class="text-gray-600 text-sm">|</span>
    <span class="text-gray-400 text-sm">Agent Admin</span>
    <div class="ml-auto flex items-center gap-2">
      <template x-if="agents.length > 0">
        <span class="text-xs bg-indigo-900 text-indigo-300 px-2 py-0.5 rounded-full"
              x-text="agents.length + ' running'"></span>
      </template>
    </div>
  </div>

  <!-- Tabs -->
  <div class="bg-gray-900 border-b border-gray-800 px-2 sm:px-6 flex gap-0 overflow-x-auto">
    <template x-for="t in tabs" :key="t.id">
      <button
        @click="tab = t.id"
        :class="tab === t.id
          ? 'border-b-2 border-indigo-500 text-indigo-400'
          : 'border-b-2 border-transparent text-gray-400 hover:text-gray-200'"
        class="px-4 py-3 text-sm font-medium transition-colors"
        x-text="t.label">
      </button>
    </template>
  </div>

  <!-- ─── DEFINITIONS ─── -->
  <div x-show="tab === 'definitions'" class="p-4 sm:p-6 max-w-7xl mx-auto">
    <div class="flex flex-col md:flex-row gap-6">

      <!-- List -->
      <div class="w-full md:w-72 md:flex-shrink-0">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Definitions</h2>
          <button @click="openNewDef()"
            class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-1 rounded transition-colors">
            + New
          </button>
        </div>
        <div class="space-y-2">
          <template x-if="definitions.length === 0">
            <p class="text-gray-500 text-sm py-4 text-center">No definitions yet</p>
          </template>
          <template x-for="def in definitions" :key="def.id">
            <div
              @click="openEditDef(def)"
              :class="editingDef && editingDef.id === def.id ? 'border-indigo-500 bg-gray-800' : 'border-gray-700 bg-gray-900 hover:border-gray-600'"
              class="border rounded-lg p-3 cursor-pointer transition-colors">
              <div class="font-medium text-sm text-gray-100 truncate" x-text="def.name"></div>
              <div class="flex items-center gap-2 mt-1">
                <span class="text-xs px-1.5 py-0.5 rounded bg-gray-700 text-gray-300" x-text="def.agent_type"></span>
                <span class="text-xs text-gray-500" x-text="def.model"></span>
              </div>
              <div class="text-xs text-gray-600 mt-1" x-text="def.tools.length + ' tools · ' + def.domains.join(', ')"></div>
            </div>
          </template>
        </div>
      </div>

      <!-- Form -->
      <div class="flex-1">
        <template x-if="!showDefForm">
          <div class="flex flex-col items-center justify-center h-64 text-gray-600">
            <svg class="w-12 h-12 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 001.357 2.059l.096.038a3 3 0 012.197 2.793v1.216m-8.25-8.821L5 14.5m0 0a3 3 0 00-3 3V19a2.25 2.25 0 002.25 2.25h13.5A2.25 2.25 0 0021 19v-1.286a3 3 0 00-2.197-2.793l-.096-.038a2.25 2.25 0 01-1.357-2.059V3.104M14.25 3.104c.251.023.501.05.75.082M3.75 3.104A23.71 23.71 0 005 3.186" />
            </svg>
            <p class="text-sm">Select a definition to edit, or create a new one</p>
          </div>
        </template>

        <template x-if="showDefForm">
          <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
            <h3 class="text-base font-semibold mb-5 text-gray-100"
                x-text="editingDef ? 'Edit Definition' : 'New Definition'"></h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <!-- Name -->
              <div class="col-span-2">
                <label class="block text-xs font-medium text-gray-400 mb-1">Name</label>
                <input x-model="defForm.name" type="text" placeholder="My Agent"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none" />
              </div>

              <!-- Description -->
              <div class="col-span-2">
                <label class="block text-xs font-medium text-gray-400 mb-1">Description</label>
                <textarea x-model="defForm.description" rows="2" placeholder="What this agent does..."
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none resize-none"></textarea>
              </div>

              <!-- Agent Type -->
              <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Agent Type</label>
                <select x-model="defForm.agent_type"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none">
                  <option value="executor">Executor</option>
                  <option value="planner">Planner</option>
                  <option value="specialist">Specialist</option>
                </select>
              </div>

              <!-- Model -->
              <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Model</label>
                <input x-model="defForm.model" type="text" placeholder="llama3.2"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none" />
              </div>

              <!-- Ollama Host -->
              <div class="col-span-2">
                <label class="block text-xs font-medium text-gray-400 mb-1">Ollama Host</label>
                <input x-model="defForm.ollama_host" type="text" placeholder="http://localhost:11434"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none" />
              </div>

              <!-- Tools -->
              <div class="col-span-2">
                <label class="block text-xs font-medium text-gray-400 mb-2">Tools</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <template x-for="tool in toolCatalog" :key="tool.name">
                    <label class="flex items-start gap-2 p-2 bg-gray-800 rounded-lg border border-gray-700 cursor-pointer hover:border-gray-600">
                      <input type="checkbox"
                        :checked="defForm.tools.includes(tool.name)"
                        @change="toggleTool(tool.name)"
                        class="mt-0.5 accent-indigo-500" />
                      <div>
                        <div class="text-xs font-mono text-indigo-300" x-text="tool.name"></div>
                        <div class="text-xs text-gray-500" x-text="tool.description"></div>
                      </div>
                    </label>
                  </template>
                </div>
              </div>

              <!-- Domains -->
              <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Domains (comma-separated)</label>
                <input x-model="defForm.domains" type="text" placeholder="code, general"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none" />
              </div>

              <!-- Default Permissions -->
              <div>
                <label class="block text-xs font-medium text-gray-400 mb-2">Default Permissions</label>
                <div class="space-y-1">
                  <template x-for="p in allPermissions" :key="p.value">
                    <label class="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox"
                        :checked="defForm.default_permissions.includes(p.value)"
                        @change="toggleArr(defForm.default_permissions, p.value)"
                        class="accent-indigo-500" />
                      <span class="text-xs text-gray-300" x-text="p.label"></span>
                    </label>
                  </template>
                </div>
              </div>

              <!-- System Prompt -->
              <div class="col-span-2">
                <label class="block text-xs font-medium text-gray-400 mb-1">
                  System Prompt <span class="text-gray-600">(optional — overrides auto-generated)</span>
                </label>
                <textarea x-model="defForm.system_prompt" rows="4"
                  placeholder="You are a specialized agent that..."
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none resize-none font-mono text-xs"></textarea>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-3 mt-6 pt-4 border-t border-gray-800">
              <button @click="saveDef()"
                class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded-lg transition-colors font-medium">
                Save
              </button>
              <template x-if="editingDef">
                <div class="flex items-center gap-2">
                  <button @click="spawnFromDef(editingDef.id, 'test')"
                    class="bg-emerald-700 hover:bg-emerald-600 text-white text-sm px-3 py-2 rounded-lg transition-colors">
                    Spawn Test
                  </button>
                  <button @click="spawnFromDef(editingDef.id, 'prod')"
                    class="bg-amber-700 hover:bg-amber-600 text-white text-sm px-3 py-2 rounded-lg transition-colors">
                    Spawn Prod
                  </button>
                </div>
              </template>
              <div class="ml-auto flex items-center gap-2">
                <button @click="showDefForm = false; editingDef = null"
                  class="text-gray-400 hover:text-gray-200 text-sm px-3 py-2 rounded-lg transition-colors">
                  Cancel
                </button>
                <template x-if="editingDef">
                  <button @click="deleteDef(editingDef.id)"
                    class="text-red-400 hover:text-red-300 text-sm px-3 py-2 rounded-lg transition-colors">
                    Delete
                  </button>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ─── RUNNING AGENTS ─── -->
  <div x-show="tab === 'agents'" class="p-4 sm:p-6 max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Running Agents</h2>
      <button @click="fetchAgents()" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">↺ Refresh</button>
    </div>

    <template x-if="agents.length === 0">
      <div class="text-center py-16 text-gray-600">
        <p class="text-sm">No running agents. Spawn one from the Definitions tab.</p>
      </div>
    </template>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <template x-for="agent in agents" :key="agent.instance_id">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
          <div class="flex items-start justify-between mb-3">
            <div>
              <div class="font-semibold text-gray-100" x-text="agent.definition_name"></div>
              <div class="text-xs text-gray-500 font-mono mt-0.5" x-text="agent.instance_id.slice(0,8) + '...'"></div>
            </div>
            <span
              :class="agent.deployment === 'prod' ? 'bg-amber-900 text-amber-300' : 'bg-emerald-900 text-emerald-300'"
              class="text-xs px-2 py-0.5 rounded-full font-medium" x-text="agent.deployment"></span>
          </div>

          <div class="space-y-1.5 text-xs text-gray-400 mb-4">
            <div class="flex items-center gap-2">
              <span class="text-gray-600">Model</span>
              <span class="text-gray-300 font-mono" x-text="agent.capability.model_backend.ollama?.model || 'custom'"></span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-gray-600">Tools</span>
              <span class="text-gray-300" x-text="agent.capability.tools_available.join(', ') || 'none'"></span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-gray-600">Tasks</span>
              <span class="text-gray-300" x-text="agent.task_count"></span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-gray-600">Started</span>
              <span class="text-gray-300" x-text="fmt(agent.started_at)"></span>
            </div>
          </div>

          <div class="flex gap-2 pt-3 border-t border-gray-800">
            <button @click="goToLab(agent.instance_id)"
              class="flex-1 text-xs bg-indigo-900 hover:bg-indigo-800 text-indigo-300 py-1.5 rounded-lg transition-colors">
              Test Lab
            </button>
            <button @click="stopAgent(agent.instance_id)"
              class="flex-1 text-xs bg-red-950 hover:bg-red-900 text-red-400 py-1.5 rounded-lg transition-colors">
              Stop
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ─── TEST LAB ─── -->
  <div x-show="tab === 'lab'" class="p-4 sm:p-6 max-w-5xl mx-auto">
    <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-5">Test Lab</h2>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
      <!-- Left: Form -->
      <div class="lg:col-span-2 space-y-4">
        <!-- Agent selector -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Agent</label>
          <select x-model="labAgentId"
            @change="prefillPermissions()"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none">
            <option value="">— select an agent —</option>
            <template x-for="agent in agents" :key="agent.instance_id">
              <option :value="agent.instance_id"
                      x-text="agent.definition_name + ' [' + agent.deployment + ']'"></option>
            </template>
          </select>
        </div>

        <!-- Intent -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Task Intent</label>
          <textarea x-model="labIntent" rows="5"
            placeholder="List all files in the current directory and summarize what you see."
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-indigo-500 focus:outline-none resize-none"></textarea>
        </div>

        <!-- Permissions -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2">Permissions</label>
          <div class="space-y-1">
            <template x-for="p in allPermissions" :key="p.value">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox"
                  :checked="labPermissions.includes(p.value)"
                  @change="toggleArr(labPermissions, p.value)"
                  class="accent-indigo-500" />
                <span class="text-xs text-gray-300" x-text="p.label"></span>
              </label>
            </template>
          </div>
        </div>

        <!-- Max Iterations -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">
            Max Iterations: <span x-text="labMaxIter"></span>
          </label>
          <input type="range" x-model.number="labMaxIter" min="1" max="50"
            class="w-full accent-indigo-500" />
        </div>

        <!-- Submit -->
        <button
          @click="submitTask()"
          :disabled="!labAgentId || !labIntent.trim() || labStatus === 'running'"
          :class="(!labAgentId || !labIntent.trim() || labStatus === 'running') ? 'opacity-50 cursor-not-allowed' : 'hover:bg-indigo-500'"
          class="w-full bg-indigo-600 text-white text-sm py-2.5 rounded-lg transition-colors font-medium">
          <span x-show="labStatus !== 'running'">Submit Task</span>
          <span x-show="labStatus === 'running'" class="flex items-center justify-center gap-2">
            <span class="spinner"></span> Running…
          </span>
        </button>
      </div>

      <!-- Right: Result -->
      <div class="lg:col-span-3">
        <!-- Idle state -->
        <template x-if="labStatus === 'idle'">
          <div class="flex items-center justify-center h-64 text-gray-600 border border-gray-800 rounded-xl">
            <p class="text-sm">Results will appear here</p>
          </div>
        </template>

        <!-- Running -->
        <template x-if="labStatus === 'running'">
          <div class="border border-gray-800 rounded-xl p-6">
            <div class="flex items-center gap-3 mb-4">
              <span class="spinner"></span>
              <span class="text-sm text-gray-400">Agent is working…</span>
            </div>
            <div class="text-xs text-gray-600 font-mono" x-text="'task: ' + (labTaskId || '…')"></div>
          </div>
        </template>

        <!-- Complete or Failed -->
        <template x-if="labStatus === 'complete' || labStatus === 'failed'">
          <div class="border rounded-xl overflow-hidden"
               :class="labStatus === 'complete' ? 'border-emerald-800' : 'border-red-800'">
            <!-- Header -->
            <div class="px-4 py-3 flex items-center gap-3"
                 :class="labStatus === 'complete' ? 'bg-emerald-950' : 'bg-red-950'">
              <span :class="labStatus === 'complete' ? 'text-emerald-400' : 'text-red-400'" class="text-sm font-semibold"
                    x-text="labStatus === 'complete' ? '✓ Complete' : '✗ Failed'"></span>
              <span class="text-xs text-gray-500 ml-auto" x-text="'task: ' + (labTaskId || '').slice(0,8) + '…'"></span>
            </div>

            <div class="p-4 space-y-4 bg-gray-900">
              <!-- Error -->
              <template x-if="labStatus === 'failed' && labResponse">
                <div class="bg-red-950 border border-red-800 rounded-lg p-3 text-xs text-red-300 font-mono"
                     x-text="labResponse.message || labResponse.error || 'Unknown error'"></div>
              </template>

              <!-- Result -->
              <template x-if="labStatus === 'complete' && labResponse">
                <div>
                  <div class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Result</div>
                  <div class="bg-gray-800 rounded-lg p-3 text-xs font-mono text-gray-200 overflow-auto max-h-48">
                    <pre x-text="JSON.stringify(labResponse.result, null, 2)"></pre>
                  </div>
                </div>
              </template>

              <!-- Actions taken -->
              <template x-if="labStatus === 'complete' && labResponse && labResponse.actions_taken && labResponse.actions_taken.length > 0">
                <div>
                  <div class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider"
                       x-text="labResponse.actions_taken.length + ' Action(s) Taken'"></div>
                  <div class="space-y-2">
                    <template x-for="(action, i) in labResponse.actions_taken" :key="i">
                      <div class="bg-gray-800 rounded-lg border border-gray-700">
                        <button @click="toggleAction(i)"
                          class="w-full flex items-center gap-2 px-3 py-2 text-left text-xs">
                          <span class="font-mono text-indigo-300" x-text="action.tool_call.tool_name"></span>
                          <span
                            :class="action.tool_result.status === 'complete' ? 'text-emerald-400' : 'text-red-400'"
                            x-text="action.tool_result.status"></span>
                          <span class="ml-auto text-gray-600" x-text="expandedActions.includes(i) ? '▲' : '▼'"></span>
                        </button>
                        <template x-if="expandedActions.includes(i)">
                          <div class="px-3 pb-3 border-t border-gray-700 pt-2 space-y-2">
                            <div>
                              <div class="text-xs text-gray-600 mb-1">Parameters</div>
                              <pre class="text-xs text-gray-300 font-mono bg-gray-900 rounded p-2 overflow-auto max-h-32"
                                   x-text="JSON.stringify(action.tool_call.parameters, null, 2)"></pre>
                            </div>
                            <div>
                              <div class="text-xs text-gray-600 mb-1">Output</div>
                              <pre class="text-xs text-gray-300 font-mono bg-gray-900 rounded p-2 overflow-auto max-h-32"
                                   x-text="JSON.stringify(action.tool_result.output, null, 2)"></pre>
                            </div>
                            <template x-if="action.tool_call.justification">
                              <div>
                                <div class="text-xs text-gray-600 mb-1">Justification</div>
                                <div class="text-xs text-gray-400 italic" x-text="action.tool_call.justification"></div>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ─── HISTORY ─── -->
  <div x-show="tab === 'history'" class="p-4 sm:p-6 max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Task History</h2>
      <button @click="fetchHistory()" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">↺ Refresh</button>
    </div>

    <template x-if="taskHistory.length === 0">
      <div class="text-center py-16 text-gray-600">
        <p class="text-sm">No tasks yet. Run one in the Test Lab.</p>
      </div>
    </template>

    <div class="space-y-2">
      <template x-for="task in taskHistory" :key="task.task_id">
        <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
          <!-- Row -->
          <button @click="toggleHistory(task.task_id)"
            class="w-full flex items-center gap-4 px-4 py-3 text-left hover:bg-gray-800 transition-colors">

            <span
              :class="{
                'text-emerald-400 bg-emerald-950 border-emerald-800': task.status === 'complete',
                'text-red-400 bg-red-950 border-red-800': task.status === 'failed',
                'text-yellow-400 bg-yellow-950 border-yellow-800': task.status === 'in_progress',
                'text-gray-400 bg-gray-800 border-gray-700': !['complete','failed','in_progress'].includes(task.status)
              }"
              class="text-xs px-2 py-0.5 rounded border font-medium flex-shrink-0"
              x-text="task.status"></span>

            <span class="text-xs font-mono text-gray-500 flex-shrink-0" x-text="task.task_id.slice(0,8)"></span>
            <span class="text-sm text-gray-200 flex-1 truncate" x-text="task.intent"></span>
            <span class="text-xs text-gray-500 flex-shrink-0" x-text="task.agent_name"></span>
            <span class="text-xs text-gray-600 flex-shrink-0" x-text="duration(task.submitted_at, task.completed_at)"></span>
            <span class="text-xs text-gray-600 flex-shrink-0" x-text="fmt(task.submitted_at)"></span>
            <span class="text-gray-600" x-text="expandedHistory === task.task_id ? '▲' : '▼'"></span>
          </button>

          <!-- Expanded details -->
          <template x-if="expandedHistory === task.task_id">
            <div class="px-4 pb-4 pt-1 border-t border-gray-800 space-y-3">
              <template x-if="task.error">
                <div class="bg-red-950 border border-red-800 rounded-lg p-3 text-xs text-red-300 font-mono"
                     x-text="task.error"></div>
              </template>

              <template x-if="task.response">
                <div>
                  <div class="text-xs text-gray-600 mb-1 font-semibold uppercase tracking-wider">Result</div>
                  <div class="bg-gray-800 rounded-lg p-3 text-xs font-mono text-gray-200 overflow-auto max-h-40">
                    <pre x-text="JSON.stringify(task.response.result, null, 2)"></pre>
                  </div>
                </div>
              </template>

              <template x-if="task.response && task.response.actions_taken && task.response.actions_taken.length > 0">
                <div class="text-xs text-gray-500"
                     x-text="task.response.actions_taken.length + ' tool call(s): ' + task.response.actions_taken.map(a => a.tool_call.tool_name).join(', ')">
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>

  <script>
  function admin() {
    return {
      tab: 'definitions',
      tabs: [
        { id: 'definitions', label: 'Definitions' },
        { id: 'agents',      label: 'Running Agents' },
        { id: 'lab',         label: 'Test Lab' },
        { id: 'history',     label: 'History' },
      ],

      allPermissions: [
        { value: 'file_read',       label: 'File Read' },
        { value: 'file_write',      label: 'File Write' },
        { value: 'bash_exec',       label: 'Bash Exec' },
        { value: 'network_access',  label: 'Network Access' },
      ],

      // ── State ──────────────────────────────────────────────
      definitions: [],
      agents: [],
      toolCatalog: [],
      taskHistory: [],

      // Definitions form
      showDefForm: false,
      editingDef: null,
      defForm: {
        name: '', description: '', agent_type: 'executor',
        model: 'llama3.2', ollama_host: 'http://localhost:11434',
        tools: [], domains: '', system_prompt: '', default_permissions: [],
      },

      // Test lab
      labAgentId: '',
      labIntent: '',
      labPermissions: [],
      labMaxIter: 20,
      labStatus: 'idle',   // idle | running | complete | failed
      labTaskId: null,
      labResponse: null,
      expandedActions: [],

      // History
      expandedHistory: null,

      // ── Init ──────────────────────────────────────────────
      async init() {
        await Promise.all([
          this.fetchDefinitions(),
          this.fetchAgents(),
          this.fetchTools(),
          this.fetchHistory(),
        ]);
      },

      // ── Fetch helpers ─────────────────────────────────────
      async fetchDefinitions() {
        const r = await fetch('/api/definitions');
        this.definitions = await r.json();
      },
      async fetchAgents() {
        const r = await fetch('/api/agents');
        this.agents = await r.json();
      },
      async fetchTools() {
        const r = await fetch('/api/tools');
        this.toolCatalog = await r.json();
      },
      async fetchHistory() {
        const r = await fetch('/api/tasks');
        this.taskHistory = await r.json();
      },

      // ── Definitions ────────────────────────────────────────
      openNewDef() {
        this.editingDef = null;
        this.defForm = {
          name: '', description: '', agent_type: 'executor',
          model: 'llama3.2', ollama_host: 'http://localhost:11434',
          tools: [], domains: '', system_prompt: '', default_permissions: [],
        };
        this.showDefForm = true;
      },

      openEditDef(def) {
        this.editingDef = def;
        this.defForm = {
          name: def.name,
          description: def.description,
          agent_type: def.agent_type,
          model: def.model,
          ollama_host: def.ollama_host,
          tools: [...def.tools],
          domains: def.domains.join(', '),
          system_prompt: def.system_prompt || '',
          default_permissions: [...def.default_permissions],
        };
        this.showDefForm = true;
      },

      async saveDef() {
        const body = {
          name: this.defForm.name.trim(),
          description: this.defForm.description.trim(),
          agent_type: this.defForm.agent_type,
          model: this.defForm.model.trim(),
          ollama_host: this.defForm.ollama_host.trim(),
          tools: this.defForm.tools,
          domains: this.defForm.domains.split(',').map(d => d.trim()).filter(Boolean),
          system_prompt: this.defForm.system_prompt.trim() || null,
          default_permissions: this.defForm.default_permissions,
        };
        if (!body.name) return;

        const url = this.editingDef ? `/api/definitions/${this.editingDef.id}` : '/api/definitions';
        const method = this.editingDef ? 'PUT' : 'POST';
        const r = await fetch(url, {
          method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        if (r.ok) {
          this.showDefForm = false;
          this.editingDef = null;
          await this.fetchDefinitions();
        }
      },

      async deleteDef(id) {
        if (!confirm('Delete this definition?')) return;
        await fetch(`/api/definitions/${id}`, { method: 'DELETE' });
        this.showDefForm = false;
        this.editingDef = null;
        await this.fetchDefinitions();
      },

      async spawnFromDef(defId, deployment) {
        const r = await fetch('/api/agents', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ definition_id: defId, deployment }),
        });
        if (r.ok) {
          await this.fetchAgents();
          this.tab = 'agents';
        }
      },

      // ── Agents ─────────────────────────────────────────────
      async stopAgent(instanceId) {
        if (!confirm('Stop this agent?')) return;
        await fetch(`/api/agents/${instanceId}`, { method: 'DELETE' });
        await this.fetchAgents();
      },

      goToLab(instanceId) {
        this.labAgentId = instanceId;
        this.prefillPermissions();
        this.tab = 'lab';
      },

      prefillPermissions() {
        const agent = this.agents.find(a => a.instance_id === this.labAgentId);
        if (!agent) return;
        const def = this.definitions.find(d => d.id === agent.definition_id);
        if (def) this.labPermissions = [...def.default_permissions];
      },

      // ── Test Lab ───────────────────────────────────────────
      async submitTask() {
        if (!this.labAgentId || !this.labIntent.trim()) return;
        this.labStatus = 'running';
        this.labResponse = null;
        this.labTaskId = null;
        this.expandedActions = [];

        const r = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            agent_instance_id: this.labAgentId,
            intent: this.labIntent.trim(),
            permissions: this.labPermissions,
            max_iterations: this.labMaxIter,
          }),
        });

        if (!r.ok) {
          this.labStatus = 'failed';
          this.labResponse = { message: 'Failed to submit task' };
          return;
        }

        const { task_id } = await r.json();
        this.labTaskId = task_id;

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${proto}//${location.host}/ws/tasks/${task_id}`);

        ws.onmessage = (e) => {
          const event = JSON.parse(e.data);
          if (event.type === 'complete') {
            this.labStatus = 'complete';
            this.labResponse = event.response;
            this.fetchHistory();
          } else if (event.type === 'failed') {
            this.labStatus = 'failed';
            this.labResponse = { message: event.message };
            this.fetchHistory();
          }
        };
        ws.onerror = () => {
          if (this.labStatus === 'running') {
            this.labStatus = 'failed';
            this.labResponse = { message: 'WebSocket error' };
          }
        };
      },

      toggleAction(i) {
        const idx = this.expandedActions.indexOf(i);
        if (idx === -1) this.expandedActions.push(i);
        else this.expandedActions.splice(idx, 1);
      },

      // ── History ────────────────────────────────────────────
      toggleHistory(id) {
        this.expandedHistory = this.expandedHistory === id ? null : id;
      },

      // ── Form helpers ───────────────────────────────────────
      toggleTool(name) {
        const idx = this.defForm.tools.indexOf(name);
        if (idx === -1) this.defForm.tools.push(name);
        else this.defForm.tools.splice(idx, 1);
      },

      toggleArr(arr, val) {
        const idx = arr.indexOf(val);
        if (idx === -1) arr.push(val);
        else arr.splice(idx, 1);
      },

      // ── Display helpers ────────────────────────────────────
      fmt(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleString();
      },

      duration(start, end) {
        const ms = (end ? new Date(end) : new Date()) - new Date(start);
        if (ms < 0) return '—';
        if (ms < 1000) return `${ms}ms`;
        if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
        return `${(ms / 60000).toFixed(1)}m`;
      },
    };
  }
  </script>
</body>
</html>
