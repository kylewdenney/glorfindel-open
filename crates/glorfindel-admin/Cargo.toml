[package]
name = "glorfindel-admin"
version = "0.1.0"
edition = "2021"
description = "Web admin dashboard for managing and testing Glorfindel agents"

[dependencies]
async-recursion = "1"
reqwest = { version = "0.12", features = ["json"] }
glorfindel-schemas = { path = "../glorfindel-schemas" }
glorfindel-tools = { path = "../glorfindel-tools" }
glorfindel-agent = { path = "../glorfindel-agent" }
glorfindel-transport = { path = "../glorfindel-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures = "0.3"
anyhow = "1"
rand = "0.8"
tmq = "0.5"
toml = "0.8"
