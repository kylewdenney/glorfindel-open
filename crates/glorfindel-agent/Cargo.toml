[package]
name = "glorfindel-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agent abstraction, registry, and Ollama-backed agent implementation"

[dependencies]
glorfindel-schemas = { path = "../glorfindel-schemas" }
glorfindel-transport = { path = "../glorfindel-transport" }
glorfindel-tools = { path = "../glorfindel-tools" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
