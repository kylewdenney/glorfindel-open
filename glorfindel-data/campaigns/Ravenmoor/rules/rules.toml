[[check_types]]
id          = "skill"
ability     = "{resolved_from_character_table}"
description = "Standard skill check using the character's relevant listed ability"
prose       = "Use the exact modifier from the character table. No guessing."

  [[check_types.tiers]]
  id           = "easy"
  dc           = 8
  triggers     = ["routine", "no pressure", "familiar task", "obvious"]
  on_fail      = "Minor setback or delay."
  on_success   = "Straightforward success."
  fail_effects = []
  succ_effects = []

  [[check_types.tiers]]
  id           = "moderate"
  dc           = 12
  triggers     = ["moderate difficulty", "standard challenge", "hidden but findable"]
  on_fail      = "Partial result or setback."
  on_success   = "Clear success."
  fail_effects = []
  succ_effects = []

  [[check_types.tiers]]
  id           = "hard"
  dc           = 16
  triggers     = ["difficult", "under pressure", "expertly hidden", "unusual circumstances"]
  on_fail      = "Failure with consequence."
  on_success   = "Success with possible detail."
  fail_effects = []
  succ_effects = []

  [[check_types.tiers]]
  id           = "extreme"
  dc           = 20
  triggers     = ["near-impossible", "exceptional feat", "legendary difficulty"]
  on_fail      = "Failure."
  on_success   = "Exceptional success."
  fail_effects = []
  succ_effects = []

